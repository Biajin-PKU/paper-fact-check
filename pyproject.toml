[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-fact-check"
version = "1.0.1"
description = "Fact-check a research paper against its own evidence: statistics, numbers, references, figures, code and reporting standards."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Biajin-PKU"}]
keywords = ["research integrity", "manuscript", "peer review", "statistics", "references", "agent skill", "mcp"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/Biajin-PKU/paper-fact-check"

[project.scripts]
paper-fact-check = "paper_fact_check.cli:main"

[tool.setuptools]
packages = ["paper_fact_check", "paper_fact_check.checks"]

[tool.setuptools.package-dir]
"" = "skills/paper-fact-check"
